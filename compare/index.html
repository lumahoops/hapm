<style>

  html[data-theme="graphite"] a.luma .lw span:nth-child(1) { color:#9DC4FF; } html[data-theme="graphite"] a.luma .lw span:nth-child(2) { color:#C1B5FF; } html[data-theme="graphite"] a.luma .lw span:nth-child(3) { color:#F3A9BA; } html[data-theme="graphite"] a.luma .lw span:nth-child(4) { color:#F2CB72; }
  /* hover: the glow runs through the letters one at a time (L, U, M, A), looping while the pointer stays */

<div class="wrap">

  <div class="ctl">
    <b>Players</b><div><input id="add" list="names" placeholder="Add a player (up to 4)"><datalist id="names"></datalist><span id="chips"></span>

<script>
const ROOT = document.body.dataset.root || "";
const VL = v => (window.VLAB && window.VLAB[v]) || "HAPM " + v;   // version labels from data/index.json
const S = { p:[], variant:"hapm", mode:"career", age:27, from:"", to:"", col:{}, rows:"sum", custom:null, color:"pct", cm:"net", x:"season", cache:{} };
const $ = id => document.getElementById(id);
const sg = x => x == null || isNaN(x) ? "" : (x > 0 ? "+" : x < 0 ? "\u2212" : "") + Math.abs(x).toFixed(2);
const LO = [238, 172, 172], MID = [234, 235, 238], HI = [190, 228, 176];
const heat = p => { if (p == null) return ""; const t = Math.min(1, Math.abs(p - 50) / 50), e = p >= 50 ? HI : LO; return `rgb(${MID.map((m, i) => Math.round(m + (e[i] - m) * t)).join(",")})`; };
const COL = ["#B5577A", "#2f6f9f", "#c08a1e", "#4b8a52"];
const TK = ["sv", "sel", "selo", "seld", "conv", "convo", "convd", "pv", "gen", "oreb", "dtov", "ret", "otov", "dreb",
  "so_r", "so_m", "so_t", "so_f", "sd_r", "sd_m", "sd_t", "sd_f", "co_r", "co_m", "co_t", "co_f", "cd_r", "cd_o"], KEYS = ["net", "o", "d", ...TK];
const ROWS = [[null, "HAPM", "sum"], ["net", "HAPM", 1], ["o", "Offense", 2], ["d", "Defense", 2],
  [null, "Shot value", "sv"], ["sv", "SV", 1], ["sel", "Selection", 2], ["selo", "O Sel", 3], ["seld", "D Sel", 3], ["conv", "Conversion", 2], ["convo", "O Conv", 3], ["convd", "D Conv", 3],
  [null, "Possession value", "pv"], ["pv", "PV", 1], ["gen", "Generation", 2], ["oreb", "O Reb", 3], ["dtov", "D TOV", 3], ["ret", "Retention", 2], ["otov", "O TOV", 3], ["dreb", "D Reb", 3],
  [null, "Zones", "zones"], ["so_r", "O Sel rim", 3], ["so_m", "O Sel mid", 3], ["so_t", "O Sel 3", 3], ["so_f", "O Sel FT", 3], ["sd_r", "D Sel rim", 3], ["sd_m", "D Sel mid", 3], ["sd_t", "D Sel 3", 3], ["sd_f", "D Sel FT", 3],
  ["co_r", "O Conv rim", 3], ["co_m", "O Conv mid", 3], ["co_t", "O Conv 3", 3], ["co_f", "O Conv FT", 3], ["cd_r", "D Conv rim", 3], ["cd_o", "D Conv other", 3]];
const GROUP = {}; { let g = null; for (const [k, , x] of ROWS) { if (!k) g = x; else GROUP[k] = g; } }
const PRESET = { sum:["net", "o", "d"], sv:["net", "sv", "sel", "selo", "seld", "conv", "convo", "convd"], pv:["net", "pv", "gen", "oreb", "dtov", "ret", "otov", "dreb"],
  zones:["sv", ...TK.slice(14)], all:KEYS };
const shown = () => new Set(S.custom || PRESET[S.rows]);
async function player(pid) { if (!S.cache[pid]) S.cache[pid] = await (await fetch(`${ROOT}data/players/${pid}.json`)).json(); return S.cache[pid]; }
function val(r, k) { const v = S.variant;
  if (k === "net" || k === "o" || k === "d") { const x = r.v[v]; return x ? x[{ o:0, d:1, net:2 }[k]] : null; }
  const c = r.c && r.c[v]; return c ? c[TK.indexOf(k)] : null; }
function cpct(k, x) { const q = S.CQ.q[S.variant][KEYS.indexOf(k)]; if (x == null || !q) return null; let i = 0; while (i < 100 && q[i + 1] <= x) i++; return i; }
// which seasons a column uses: its own header choice, else the global mode
function pick(P) {
  const rows = P.seasons.filter(r => r.v[S.variant]), own = S.col[P.i] || "", m = own || S.mode;
  if (m === "career") return { rows, lab:`Career, ${rows[0].s.slice(0, 4)} to ${rows[rows.length - 1].s.slice(5)}` };
  if (m === "latest") return { rows:rows.slice(-1), lab:rows[rows.length - 1].s };
  if (m === "best") { const b = rows.reduce((b, r) => (val(r, "net") > val(b, "net") ? r : b), rows[0]); return { rows:[b], lab:`Best: ${b.s}` }; }
  if (m === "age") { const r = rows.filter(r => r.a === +S.age); return { rows:r, lab:r.length ? `Age ${S.age}: ${r.map(x => x.s).join(", ")}` : `No season at age ${S.age}` }; }
  if (m === "range") { const r = rows.filter(r => r.s >= S.from && r.s <= S.to); return { rows:r, lab:`${S.from} to ${S.to}` }; }
  const r = rows.filter(r => r.s === m); return { rows:r, lab:m };
}
function column(P) {
  const { rows, lab } = pick(P), out = { lab, poss:rows.reduce((a, r) => a + r.p, 0), v:{}, q:{} };
  for (const k of KEYS) { let a = 0, w = 0; for (const r of rows) { const x = val(r, k); if (x != null) { a += x * r.p; w += r.p; } }
    out.v[k] = w ? a / w : null;
    out.q[k] = rows.length === 1 ? ((rows[0].q && rows[0].q[S.variant] || [])[KEYS.indexOf(k)] ?? null) : cpct(k, out.v[k]); }
  out.multi = rows.length > 1; return out;
}
function cellColor(k, x, p, xs) {
  if (S.color === "none" || x == null) return "";
  if (S.color === "pct") return heat(p);
  const ok = xs.filter(y => y != null); if (ok.length < 2) return "";
  if (S.color === "win" && x === Math.max(...ok)) return "rgb(190,228,176)";
  if (S.color === "lose" && x === Math.min(...ok)) return "rgb(238,172,172)";
  return "";
}
async function render() {
  [...$("mode").children].forEach(b => b.classList.toggle("on", b.dataset.m === S.mode));
  [...$("preset").children].forEach(b => b.classList.toggle("on", !S.custom && b.dataset.r === S.rows));
  [...$("color").children].forEach(b => b.classList.toggle("on", b.dataset.c === S.color));
  [...$("xax").children].forEach(b => b.classList.toggle("on", b.dataset.x === S.x));
  $("ageBox").style.display = S.mode === "age" ? "" : "none"; $("rangeBox").style.display = S.mode === "range" ? "" : "none";
  const Ps = await Promise.all(S.p.map(player)), C = Ps.map(column), on = shown();
  $("chips").innerHTML = Ps.map((P, i) => `<span class="chip" style="color:${COL[i]}" data-rm="${P.i}" title="Remove">${P.n} \u00d7</span>`).join(" ");
  document.querySelectorAll("[data-rm]").forEach(el => el.onclick = () => { S.p = S.p.filter(p => p !== +el.dataset.rm); delete S.col[el.dataset.rm]; render(); });
  history.replaceState(null, "", "#" + new URLSearchParams(Object.entries({ p:S.p.join(","), v:S.variant, s:S.mode, age:S.mode === "age" ? S.age : "",
    f:S.mode === "range" ? S.from : "", t:S.mode === "range" ? S.to : "", col:Object.entries(S.col).map(([a, b]) => `${a}:${b}`).join(","),
    r:S.custom ? "" : S.rows, rows:S.custom ? [...S.custom].join(",") : "", c:S.color, cm:S.cm, x:S.x }).filter(([, x]) => x)).toString());
  if (!Ps.length) { $("table").innerHTML = '<p class="note">Add players above, or try a matchup.</p>'; $("chart").innerHTML = ""; $("legend").innerHTML = ""; $("note").textContent = ""; return; }
  const opt = P => [["", "Same as all"], ["career", "Career"], ["best", "Best season"], ["latest", "Latest season"], ...P.seasons.filter(r => r.v[S.variant]).map(r => [r.s, `${r.s}${r.a ? " (age " + r.a + ")" : ""}`]).reverse()]
    .map(([v, l]) => `<option value="${v}"${(S.col[P.i] || "") === v ? " selected" : ""}>${l}</option>`).join("");
  let h = `<table><thead><tr><th></th>${Ps.map((P, i) => `<th class="pn"><a href="${ROOT}player/${P.slug}/" style="color:${COL[i]}">${P.n}</a></th>`).join("")}</tr>` +
    `<tr><th></th>${Ps.map(P => `<th><select data-col="${P.i}">${opt(P)}</select></th>`).join("")}</tr>` +
    `<tr><th></th>${C.map(c => `<th style="font-weight:400;color:#5f636b">${c.lab}<br>${c.poss.toLocaleString()} poss</th>`).join("")}</tr></thead><tbody>`;
  let g = null;
  for (const [k, lab, lv] of ROWS) {
    if (!k) { g = lab; continue; }
    if (!on.has(k)) continue;
    if (g) { h += `<tr class="g"><td colspan="${Ps.length + 1}">${g}</td></tr>`; g = null; }

function chart(Ps) {   // the chosen metric by season, age or year of career; one line per player

  const X = t => L + (W - L - R) * (x1 === x0 ? .5 : (t - x0) / (x1 - x0)), Y = t => T + (H - T - B) * (hi - t) / (hi - lo);
  const st = (hi - lo) > 16 ? 5 : (hi - lo) > 6 ? 2 : 1; let g = "";

  const xstep = Math.max(1, Math.ceil((x1 - x0) / 9));
  for (let t = x0; t <= x1; t += xstep) g += `<text x="${X(t)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#5f636b">${S.x === "season" ? `${String(t).slice(2)}-${String(t + 1).slice(2)}` : t}</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H}" text-anchor="middle" font-size="10" fill="#5f636b">${{ season:"Season", age:"Age", year:"Year of career" }[S.x]}</text>`;
  pts.forEach((ps, i) => { g += `<polyline points="${ps.map(o => `${X(o.x).toFixed(1)},${Y(o.y).toFixed(1)}`).join(" ")}" fill="none" stroke="${COL[i]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    ps.forEach(o => g += `<circle cx="${X(o.x)}" cy="${Y(o.y)}" r="2.4" fill="${COL[i]}"><title>${Ps[i].n} ${o.s}: ${sg(o.y)}</title></circle>`); });

}

(async () => {
